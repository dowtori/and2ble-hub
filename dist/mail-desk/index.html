e","plan":"tiktok","planLabel":"TikTok 전용","title":"재참여 리마인드 · TikTok 전용","lang":"ko","subject":"[한국어 검수용] [SIRIAI] 이번에도 함께해 주시겠어요? | AND2BLE 재참여 제안 (TikTok 전용)","html":"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>[한국어 검수용] [SIRIAI] 이번에도 함께해 주시겠어요? | AND2BLE 재참여 제안 (TikTok 전용)\u003c/title>\u003c/head>\u003cbody style=\"margin:0;padding:24px 16px;background:#f4f3ef\">\u003cdiv style=\"display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all\">약 20초, TikTok 전용 모집입니다. 게시 기간은 11/9~11/18입니다.\u003c/div>\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" width=\"100%\" style=\"width:100%;max-width:640px;margin:0 auto;background:#fff;border-collapse:collapse\">\u003ctr>\u003ctd style=\"padding:24px;font-family:Arial,'Yu Gothic',Meiryo,'Malgun Gothic',sans-serif;font-size:15px;line-height:1.85;color:#242620\">\u003cp style=\"font-size:11px;letter-spacing:2px;font-weight:bold;color:#63695d\">SIRIAI CAMPAIGN / AND2BLE\u003c/p>\u003ch1 style=\"font-size:24px;line-height:1.45;margin:16px 0 24px\">이번에도 함께할 수 있다면 기쁘겠습니다.\u003c/h1>\u003cp style=\"margin:0 0 16px\">\u003cstrong>한국어 내부 검수용 · 신청 버튼은 실제 일본어 모집 페이지로 연결됩니다.\u003c/strong>\u003c/p>\u003cp style=\"margin:0 0 16px\">{{CREATOR_NAME}}님, 안녕하세요. SIRIAI(시리아이)입니다.\u003c/p>\u003cp style=\"margin:0 0 16px\">이전 SIRIAI 캠페인에 참여해 주셔서 감사합니다. 앞서 안내드린 AND2BLE 「French Kissing」 댄스 챌린지에도 다시 함께하고 싶어 한 번 더 연락드립니다.\u003c/p>\u003cp style=\"margin:0 0 16px\">이번에 부탁드리는 콘텐츠는 \u003cstrong>지정 안무를 추는 약 20초 영상\u003c/strong>입니다. \u003cstrong>TikTok에 영상 1개를 게시하는 모집입니다.\u003c/strong>일정이 맞으시면 검토해 주시면 기쁘겠습니다.\u003c/p>\u003cdiv style=\"background:#f4f3ef;border-left:3px solid #242620;padding:16px;margin:24px 0\">\u003cstrong>참여 내용을 다시 한 번 안내드립니다\u003c/strong>\u003cbr>· 게시 기간: \u003cstrong>2026년 11월 9일(월)~11월 18일(수)\u003c/strong>, 일본 시간\u003cbr>· 내용: AND2BLE 「French Kissing」 지정 안무, 약 20초\u003cbr>· TikTok: \u003cstrong>5,000엔 상당\u003c/strong>\u003c/div>\u003cp style=\"margin:0 0 16px\">참여 확정 후 가이드에 맞는 게시물을 확인하고, Apple·Google Play·라쿠텐 중 선택하신 기프트카드로 리워드를 전달드립니다.\u003c/p>\u003cp style=\"margin:0 0 18px\">\u003cstrong>친구추천으로 1명당 2,000엔 상당 추가\u003c/strong>\u003cbr>아직 캠페인에 신청하지 않은 친구를 추천하고 그 친구의 신규 참여가 인정되면, 본인의 참여 리워드에 친구 1명당 2,000엔 상당을 추가합니다. 정원이 찰 때까지 몇 명이든 추천할 수 있으며, 추천 방법과 상세 조건은 선정 시 안내드립니다.\u003c/p>\u003cp style=\"margin:0 0 16px\">내용을 조금 더 보고 결정하고 싶으셔도 괜찮습니다. 아래 페이지에서 확인하신 뒤, 참여를 원하시면 페이지 안의 폼으로 신청해 주세요.\u003c/p>\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:24px 0\">\u003ctr>\u003ctd bgcolor=\"#242620\" style=\"border-radius:4px\">\u003ca href=\"https://and2ble-hub.vercel.app/guideline/ja.html\" style=\"display:inline-block;padding:16px 24px;color:#fff;font-weight:bold;text-decoration:none\">내용 확인하고 참여 신청하기\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"font-size:12px;color:#63695d;overflow-wrap:anywhere\">https://and2ble-hub.vercel.app/guideline/ja.html\u003c/p>\u003cp style=\"margin:0 0 16px\">SIRIAI에서 신청 내용을 확인한 뒤 참여 확정 메일과 상세 제작·음원 설정 가이드를 보내드립니다. \u003cstrong>신청만으로 참여가 확정되는 것은 아닙니다.\u003c/strong>\u003c/p>\u003cp style=\"margin:0 0 16px\">일정이나 촬영, 음원 설정이 고민된다면 이 메일에 한 줄로 문의하셔도 괜찮습니다. 예를 들어 “음원 설정이 조금 걱정돼요”처럼 편하게 말씀해 주세요.\u003c/p>\u003cp style=\"margin:0 0 16px\">다시 함께 AND2BLE의 새로운 음악을 전할 수 있기를 기대하겠습니다.\u003c/p>\u003cp style=\"margin:24px 0 0;font-size:12px;line-height:1.8;color:#63695d\">이미 신청하거나 회신하셨다면 안내가 엇갈린 점 양해 부탁드립니다. 다시 대응하실 필요는 없습니다. 이번 일정이 맞지 않으셔도 부담 갖지 않으셔도 됩니다.\u003c/p>\u003cp style=\"margin-top:32px;border-top:1px solid #ddd;padding-top:24px\">SIRIAI 캠페인 운영팀\u003cbr>\u003ca href=\"mailto:sbsiriai@gmail.com\" style=\"color:#315d3d\">sbsiriai@gmail.com\u003c/a>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/body>\u003c/html>","fields":["CREATOR_NAME"],"note":"이전에 연락한 기존 협업자 중 미신청·미회신 대상용입니다. 해당 플랫폼의 모집 상태를 확인하세요. 친구추천 보상과 선정 시 상세 안내를 포함합니다."}]</script>
<script>
const templates=JSON.parse(document.getElementById('templates').textContent);
const state={plan:'instagram',stage:'invite',lang:'ja'};
const byId=id=>document.getElementById(id);
const active=()=>templates.find(t=>t.plan===state.plan&&t.stage===state.stage&&t.lang===state.lang);
function messageHtml(){
  const name=byId('name').value.trim();
  const escaped=name.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return active().html.replace('{{CREATOR_NAME}}',()=>escaped||(state.lang==='ja'?'（お名前）':'(이름)'));
}
function textBody(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('[style*="display:none"]').forEach(el=>el.remove());
  doc.querySelectorAll('a[href^="https:"]').forEach(el=>el.append(' ('+el.getAttribute('href')+')'));
  doc.querySelectorAll('br').forEach(el=>el.replaceWith('\n'));
  doc.querySelectorAll('p,h1,h2,th,td').forEach(el=>el.append('\n\n'));
  return doc.body.textContent.trim().replace(/\n{3,}/g,'\n\n');
}
function render(){
  const follow=state.stage==='reinvite',ja=state.lang==='ja',ready=!follow||!!byId('name').value.trim();
  document.querySelectorAll('[data-key]').forEach(b=>b.setAttribute('aria-pressed',String(state[b.dataset.key]===b.dataset.value)));
  byId('personal').hidden=!follow;
  byId('gmail').hidden=byId('eml').hidden=!ja;
  ['gmail','eml','bodyCopy'].forEach(k=>byId(k).disabled=!ready);
  byId('instructions').textContent=follow&&!ready?'리마인드에 넣을 크리에이터 이름을 입력하세요.':ja?'‘Gmail에서 작성’을 누르면 서식 있는 본문이 복사됩니다. Gmail 본문에 붙여넣고 수신자를 입력하세요.':'일본어 발송본과 같은 조건을 한국어로 확인할 수 있습니다.';
  byId('subject').textContent=active().subject;
  byId('preview').srcdoc=messageHtml();
  byId('fallback').hidden=true;byId('status').textContent='';
}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{
  if(state[b.dataset.key]===b.dataset.value)return;
  if(b.dataset.key!=='lang')byId('name').value='';
  state[b.dataset.key]=b.dataset.value;render();
}));
byId('name').addEventListener('input',render);
byId('gmail').onclick=async ()=>{
  const tab=window.open('about:blank','_blank');
  if(tab)tab.opener=null;
  const copied=await copy('body');
  if(!copied){tab?.close();return;}
  const url=new URL('https://mail.google.com/mail/u/?authuser=sbsiriai%40gmail.com');
  url.searchParams.set('view','cm');url.searchParams.set('fs','1');
  url.searchParams.set('su',active().subject);
  if(tab)tab.location.href=url.href;
  else byId('status').textContent='본문을 복사했습니다. Gmail 새 창을 허용하거나 직접 Gmail에서 작성하세요.';
};
async function copy(kind){
  const html=messageHtml(),plain=kind==='subject'?active().subject:textBody(html);
  try {
    if(kind==='subject')await navigator.clipboard.writeText(plain);
    else {
      const doc=new DOMParser().parseFromString(html,'text/html');
      const wrapper=doc.createElement('div');
      wrapper.style.cssText=doc.body.style.cssText;
      wrapper.innerHTML=doc.body.innerHTML;
      const body=wrapper.outerHTML;
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([body],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);
    }
    byId('status').textContent=kind==='subject'?'제목을 복사했습니다.':'서식 있는 본문을 복사했습니다.';
    return true;
  } catch {
    if(kind==='body'){
      const frame=byId('preview');
      const doc=frame.contentDocument;
      const range=doc.createRange();range.selectNodeContents(doc.body);
      frame.focus();
      const selection=frame.contentWindow.getSelection();selection.removeAllRanges();selection.addRange(range);
      byId('status').textContent='미리보기의 본문을 선택했습니다. 직접 복사하거나 EML 초안을 내려받으세요.';
      return false;
    }
    const el=byId('fallback');el.hidden=false;el.value=plain;el.focus();el.select();
    byId('status').textContent='선택된 텍스트를 직접 복사하세요.';
    return false;
  }
}
byId('subjectCopy').onclick=()=>copy('subject');byId('bodyCopy').onclick=()=>copy('body');
const b64=s=>btoa(Array.from(new TextEncoder().encode(s),b=>String.fromCharCode(b)).join(''));
function mimeSubject(subject){
  let chunks=[''];
  for(const char of subject){if(new TextEncoder().encode(chunks.at(-1)+char).length>36)chunks.push('');chunks[chunks.length-1]+=char;}
  return chunks.map(chunk=>'=?UTF-8?B?'+b64(chunk)+'?=').join('\r\n ');
}
byId('eml').onclick=()=>{
  const html=messageHtml(),boundary='and2ble-'+crypto.randomUUID();
  const lines=['X-Unsent: 1','Subject: '+mimeSubject(active().subject),'MIME-Version: 1.0','Content-Type: multipart/alternative; boundary="'+boundary+'"',''];
  for(const [type,body] of [['plain',textBody(html)],['html',html]])lines.push('--'+boundary,'Content-Type: text/'+type+'; charset=UTF-8','Content-Transfer-Encoding: base64','',b64(body).match(/.{1,76}/g).join('\r\n'));
  lines.push('--'+boundary+'--','');
  const url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'message/rfc822'}));
  const a=document.createElement('a');a.href=url;a.download='AND2BLE-'+active().id+'.eml';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  byId('status').textContent='EML 초안을 내려받았습니다.';
};
render();
</script></body></html>
